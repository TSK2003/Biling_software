[package]
name = "billing-software"
version = "0.1.0"
description = "Billing Software - Production Desktop Billing System"
authors = ["Billing Software"]
edition = "2021"
default-run = "billing-software"

[[bin]]
name = "billing-software"
path = "src/main.rs"

[[bin]]
name = "make_usb_key"
path = "src/bin/make_usb_key.rs"

[lib]
name = "billing_software_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# Authentication & Security
argon2 = "0.5"
rand = "0.8"

# Licensing - Ed25519 asymmetric cryptography
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }

# Encryption for activation records
aes-gcm = "0.10"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"

# Device fingerprinting (Windows WMI)
wmi = "0.14"

# USB detection
sysinfo = "0.32"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

# Image processing
image = "0.25"

# Excel generation
rust_xlsxwriter = "0.79"

# Excel import
calamine = "0.26"

# PDF generation
genpdf = "0.2"

# Network API Server & Local Discovery
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.5", features = ["cors", "trace"] }
local-ip-address = "0.6"

# Google Drive API & Network Client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["full"] }

# File operations
zip = "2"
walkdir = "2"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
